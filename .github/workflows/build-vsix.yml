name: Build VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild 17.x to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"

      - name: Debug MSBuild info
        shell: pwsh
        run: |
          msbuild -version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -products * -format json | Out-String

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore SSMS20/SSMS20.csproj

      - name: Build SSMS20 VSIX (Release)
        shell: pwsh
        run: |
          msbuild SSMS20/SSMS20.csproj -p:Configuration=Release -p:Platform=AnyCPU -p:DeployExtension=false -v:m
          Get-ChildItem -Recurse SSMS20/bin/Release | Select-Object FullName

      - name: Locate produced VSIX
        id: findvsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix produced"; exit 1 }
          Copy-Item $vsix.FullName "WakaTime.SSMS20.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakaTime.SSMS20.vsix
          path: WakaTime.SSMS20.vsix

      - name: Upload VSIX to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WakaTime.SSMS20.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
