name: Build VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-2019 ships VS 2019 (no VS 2022 MSBuild). Install the
      # Visual Studio 2022 Build Tools so VSSDK targets resolve to a 17.x install.
      - name: Install Visual Studio 2022 Build Tools
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vs_buildtools.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\vs_buildtools.exe"
          & "$env:TEMP\vs_buildtools.exe" --quiet --wait --norestart --nocache `
            --installPath "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools" `
            --add Microsoft.Component.MSBuild `
            --add Microsoft.VisualStudio.Component.VSSDK | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit 1 }

      - name: Locate MSBuild 17.x
        shell: pwsh
        run: |
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          }
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore SSMS20/SSMS20.csproj

      - name: Build SSMS20 VSIX (Release)
        shell: pwsh
        run: |
          & $env:MSBUILD SSMS20/SSMS20.csproj -p:Configuration=Release -p:Platform=AnyCPU -p:DeployExtension=false -v:m
          Get-ChildItem -Recurse SSMS20/bin/Release | Select-Object FullName

      - name: Locate produced VSIX
        id: findvsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix produced"; exit 1 }
          Copy-Item $vsix.FullName "WakaTime.SSMS20.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakaTime.SSMS20.vsix
          path: WakaTime.SSMS20.vsix

      - name: Upload VSIX to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WakaTime.SSMS20.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
