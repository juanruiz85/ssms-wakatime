name: Build VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest currently ships VS 2026 Insiders only (setup-msbuild finds no 17.x),
      # and windows-2019 has no VS 2022 at all. Install the VS 2022 Build Tools with the
      # VSSDK workload explicitly so Microsoft.VsSDK.targets resolves a 17.x install.
      - name: Install Visual Studio 2022 Build Tools (VSSDK)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "$env:TEMP\vsbt.exe"
          $p = Start-Process -FilePath "$env:TEMP\vsbt.exe" -ArgumentList @(
            '--quiet','--wait','--norestart','--nocache',
            '--installPath','C:\BuildTools2022',
            '--add','Microsoft.VisualStudio.Workload.VSSDKBuildTools',
            '--add','Microsoft.VisualStudio.Component.MSBuild',
            '--includeRecommended'
          ) -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Write-Error "VS Bootstrapper failed with code $($p.ExitCode)"; exit 1 }

      - name: Locate MSBuild 17.x
        shell: pwsh
        run: |
          $msb = Get-ChildItem "C:\BuildTools2022\MSBuild\Current\Bin\MSBuild.exe","C:\Program Files*\Microsoft Visual Studio\2022\*\MSBuild\Current\Bin\MSBuild.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msb) { Write-Error "MSBuild 17 not found after install"; exit 1 }
          "MSBUILD=$($msb.FullName)" >> $env:GITHUB_ENV
          & $msb.FullName -version

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          & $env:MSBUILD SSMS20/SSMS20.csproj -t:Restore -p:Configuration=Release -v:m

      - name: Build SSMS20 VSIX (Release)
        shell: pwsh
        run: |
          # The VSSDK targets picked up from the VS 18 Insiders extension SDK ship an older
          # XSD that rejects <Dependencies>/<Assets>. Override with the complete schema set
          # vendored in the repo (from Microsoft.VSSDK.BuildTools 17.9 NuGet package).
          $xsd = Join-Path $PWD 'SSMS20\VsixSchemas\PackageManifestSchema.xsd'
          "Using schema: $xsd (exists=$(Test-Path $xsd))"
          & $env:MSBUILD SSMS20/SSMS20.csproj -p:Configuration=Release -p:Platform=AnyCPU -p:DeployExtension=false "-p:VsixManifestSchemaPath=$xsd" -v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse SSMS20/bin/Release | Select-Object FullName

      - name: Locate produced VSIX
        id: findvsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { Write-Error "No .vsix produced"; exit 1 }
          Copy-Item $vsix.FullName "WakaTime.SSMS20.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakaTime.SSMS20.vsix
          path: WakaTime.SSMS20.vsix

      - name: Upload VSIX to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WakaTime.SSMS20.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
